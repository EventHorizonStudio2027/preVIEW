<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#111827;color:#f9fafb;font:16px system-ui;text-align:center;margin:0;padding:24px}button{border:0;background:#8b5cf6;color:white;padding:12px 20px;border-radius:10px;cursor:pointer;margin:8px}#field{max-width:420px;margin:12px auto;border:1px solid #374151;border-radius:18px;padding:25px;background:#1f2937}#score{font-size:52px;font-weight:700}</style></head><body><div id="field"><h2>Checkpoint demo</h2><p>Collect stars to increase your score.</p><div id="score">0</div><button id="collect">★ Collect star</button><button id="clear">Reset</button><p id="status">Ready to play</p></div><script src="../src/sdk.js"></script><script>let score=0,paused=false;const update=()=>{document.getElementById('score').textContent=score;document.getElementById('status').textContent=score>=5?'Achievement unlocked!':'Keep collecting'};document.getElementById('collect').onclick=()=>{if(!paused){score++;update()}};document.getElementById('clear').onclick=()=>{if(!paused){score=0;update()}};preVIEW.register({pause:()=>{paused=true;document.getElementById("status").textContent="Paused"},resume:()=>{paused=false;update()},capture:()=>({score}),restore:(saved)=>{if(!saved||!Number.isSafeInteger(saved.score)||saved.score<0)throw Error('Invalid save');score=saved.score;update()}});</script></body></html>
