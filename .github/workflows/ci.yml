name: preVIEW CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests when project is present
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm test
          else
            echo "Source import pending: no package.json yet"
          fi
