name: preVIEW CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete application source
        shell: bash
        run: |
          set -euo pipefail
          for path in index.html src/app.js src/model.js src/sdk.js src/styles.css examples/checkpoint-demo.html assets/brand/mark.svg; do
            if [ ! -s "$path" ]; then
              echo "::error file=$path::Missing application source or brand asset: $path"
              exit 1
            fi
          done
  browser-smoke:
    needs: [unit-tests, source-integrity]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: npm run test:browser
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: browser-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 7
